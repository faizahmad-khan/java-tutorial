{% extends "base.html" %}

{% block title %}Set New Password - Java Mastery{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-box">
            <h2>Set New Password</h2>
            <p>Enter your new password.</p>
            
            <form id="set-password-form">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required minlength="8">
                    <small class="form-help">Password must be at least 8 characters long and include uppercase, lowercase, number, and special character.</small>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
                
                <button type="submit" class="btn-primary">Reset Password</button>
            </form>
        </div>
    </div>
</section>

<script>
document.getElementById('set-password-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (password !== confirmPassword) {
        alert('Passwords do not match!');
        return;
    }
    
    // Get token from URL
    const token = window.location.pathname.split('/').pop();
    
    try {
        const response = await fetch(`/reset_password/${token}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ password: password })
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('Password reset successfully! You can now log in with your new password.');
            window.location.href = '/login';
        } else {
            alert('Error: ' + result.message);
        }
    } catch (error) {
        console.error('Error:', error);
        alert('An error occurred. Please try again.');
    }
});
</script>
{% endblock %}
