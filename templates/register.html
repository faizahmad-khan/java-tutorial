{% extends "base.html" %}

{% block title %}Register - Java Mastery{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-container">
            <h2>Create Your Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" name="username" placeholder="Choose a username (min 3 characters)" required minlength="3">
                    <small id="username-error" style="color: red; display: none;"></small>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" placeholder="Enter your email" required>
                    <small id="email-error" style="color: red; display: none;"></small>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" placeholder="Password (min 6 characters)" required minlength="6">
                    <small id="password-error" style="color: red; display: none;"></small>
                </div>
                <div class="form-group">
                    <label for="reg-confirm-password">Confirm Password</label>
                    <input type="password" id="reg-confirm-password" name="confirm-password" placeholder="Re-enter your password" required minlength="6">
                    <small id="confirm-error" style="color: red; display: none;"></small>
                </div>
                <button type="submit" class="btn-primary" id="register-btn">Create Account</button>
            </form>
            <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirmPassword = document.getElementById('reg-confirm-password').value;
    const registerBtn = document.getElementById('register-btn');
    
    // Clear previous errors
    document.getElementById('username-error').style.display = 'none';
    document.getElementById('email-error').style.display = 'none';
    document.getElementById('password-error').style.display = 'none';
    document.getElementById('confirm-error').style.display = 'none';
    
    let hasError = false;
    
    // Validation
    if (username.length < 3) {
        document.getElementById('username-error').textContent = 'Username must be at least 3 characters';
        document.getElementById('username-error').style.display = 'block';
        hasError = true;
    }
    
    if (!email.includes('@')) {
        document.getElementById('email-error').textContent = 'Please enter a valid email';
        document.getElementById('email-error').style.display = 'block';
        hasError = true;
    }
    
    if (password.length < 6) {
        document.getElementById('password-error').textContent = 'Password must be at least 6 characters';
        document.getElementById('password-error').style.display = 'block';
        hasError = true;
    }
    
    if (password !== confirmPassword) {
        document.getElementById('confirm-error').textContent = 'Passwords do not match';
        document.getElementById('confirm-error').style.display = 'block';
        hasError = true;
    }
    
    if (hasError) {
        return;
    }
    
    const formData = {
        username: username,
        email: email,
        password: password
    };
    
    try {
        registerBtn.disabled = true;
        registerBtn.textContent = 'Creating Account...';
        
        const response = await fetch('/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('Account created successfully! You will be redirected to login.');
            window.location.href = result.redirect_url || '/login';
        } else {
            alert('Registration failed: ' + result.message);
            registerBtn.disabled = false;
            registerBtn.textContent = 'Create Account';
        }
    } catch (error) {
        console.error('Registration error:', error);
        alert('An error occurred during registration. Please try again.');
        registerBtn.disabled = false;
        registerBtn.textContent = 'Create Account';
    }
});
</script>
{% endblock %}
