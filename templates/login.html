{% extends "base.html" %}

{% block title %}Login - Java Mastery{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-box">
            <h2>Login to Your Account</h2>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div id="two-factor-section" style="display: none;">
                    <div class="form-group">
                        <label for="two_factor_token">Two-Factor Authentication Code</label>
                        <input type="text" id="two_factor_token" name="two_factor_token" placeholder="Enter 6-digit code" maxlength="6">
                    </div>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                
                <button type="submit" class="btn-primary">Login</button>
            </form>
            
            <div class="auth-links">
                <p>Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
                <p><a href="{{ url_for('reset_password_request') }}">Forgot password?</a></p>
            </div>
        </div>
    </div>
</section>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;
    const twoFactorToken = document.getElementById('two_factor_token').value;
    
    try {
        const response = await fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
                username: username, 
                password: password,
                remember: remember,
                two_factor_token: twoFactorToken
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            window.location.href = result.redirect_url || '/dashboard';
        } else if (result.requires_2fa) {
            // Show 2FA input field
            document.getElementById('two-factor-section').style.display = 'block';
            document.getElementById('password').focus();
        } else {
            alert('Login failed: ' + result.message);
        }
    } catch (error) {
        console.error('Error:', error);
        alert('An error occurred. Please try again.');
    }
});
</script>
{% endblock %}
